<!DOCTYPE html>
<html>
<head>
  <title>Campus Upgrade</title>
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f7fa;
      text-align: center;
    }
 
    header {
      background: linear-gradient(90deg, #003366, #007BFF);
      color: white;
      padding: 25px;
    }
 
    h2 {
      margin-top: 30px;
    }
 
    .container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
 
    .card {
      background: white;
      margin: 15px;
      padding: 20px;
      border-radius: 15px;
      width: 250px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }
 
    .card:hover {
      transform: scale(1.05);
    }
 
    button {
      padding: 10px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
 
    button:hover {
      background: #0056b3;
    }
 
    /* POPUP */
    #popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
    }
 
    .popup-box {
      background: white;
      padding: 25px;
      width: 350px;
      margin: 120px auto;
      border-radius: 15px;
      text-align: left;
      animation: fadeIn 0.3s;
    }
 
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
 
  </style>
</head>
 
<body>
 
<header>
  <h1>🎓 Campus Upgrade Plan</h1>
  <p>Improving classrooms and student experience</p>
</header>
 
<h2>✨ Our Solutions</h2>
 
<div class="container">
 
  <div class="card">
    <h3>Modern Classrooms</h3>
    <p>New furniture & design</p>
    <button onclick="show('modern')">View Details</button>
  </div>
 
  <div class="card">
    <h3>Smart Technology</h3>
    <p>Interactive screens & WiFi</p>
    <button onclick="show('tech')">View Details</button>
  </div>
 
  <div class="card">
    <h3>Better Comfort</h3>
    <p>Lighting, air & seating</p>
    <button onclick="show('comfort')">View Details</button>
  </div>
 
</div>
